# Publishes the static site to GitHub Pages on every push to yolo, only after
# the same Nix test check that Mechatron Prime CI runs has passed here too.
# Mechatron Prime CI remains the project's CI; this workflow gates and deploys.
name: Deploy to GitHub Pages

on:
  push:
    branches: [yolo]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deployment per branch at a time; a newer push supersedes an older one.
concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@v31
      # The full test suite gates the deploy: a failing commit is never published.
      - name: Test
        run: nix build --no-link .#checks.x86_64-linux.test
      - name: Build
        run: |
          nix build .#default
          cp -RL result/dist _site
          chmod -R u+w _site
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
