# Publishes the static site to GitHub Pages on every push to yolo. It builds the
# same Nix package that Mechatron Prime CI builds and tests; this workflow only
# deploys, it is not the project's CI.
name: Deploy to GitHub Pages

on:
  push:
    branches: [yolo]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@v31
      - name: Build
        run: |
          nix build .#default
          cp -RL result/dist _site
          chmod -R u+w _site
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
